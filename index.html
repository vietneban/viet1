<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trang Cá Nhân</title>
    <style>
        body {
            background: #ffecd2;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            margin: 0 auto;
        }
        img {
            width: 100%;
            border-radius: 15px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 17px;
        }
        .btn {
            background: #ff9a9e;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="anh-ban-be.jpg" alt="Ảnh bạn bè">
        <h1>Tên Của Bạn</h1>
        <p>Những người bạn tuyệt vời ✨</p>
        <p>Cùng học tập, cùng vui chơi. Mãi là bạn tốt!</p>
        <button class="btn">Yêu bạn bè ❤️</button>
    </div>
</body>
</html>
